# DataBUS template for the Czech plant-macrofossil file.
# Input file: data/CZ_makro_long.csv, produced from data/CZ_makro_short.csv by
#   uv run src/prepare_makro.py
# One row is one measurement. `groupby: true` on the depth makes rows with the same depth one
# analysis unit / sample (needs DataBUS with group_rows).
#
apiVersion: neotoma v2.0
headers: 1
kind: Development
metadata:
# ── Constants (read from `value:`, not from a CSV column) ─────────────────────
- column: datasettypeid
  neotoma: ndb.datasettypes.datasettypeid
  required: true
  value: plant macrofossil
- column: databaseid
  neotoma: ndb.datasetdatabases.databasename
  required: true
  value: European Plant Macrofossil Database
### Sites
- column: Naleziste
  neotoma: ndb.sites.sitename
  notes: name by author
  required: false
  rowwise: false
  type: string
- column: Vyzkumy_nadmV
  neotoma: ndb.sites.altitude
  required: false
  rowwise: false
  type: float
- column: WGS_Y
  neotoma: ndb.sites.geog.latitude
  required: false
  rowwise: false
  type: float
- column: WGS_X
  neotoma: ndb.sites.geog.longitude
  required: false
  rowwise: false
  type: float
- column: lokalita
  neotoma: ndb.sites.sitedescription
  required: false
  rowwise: false
  type: string
### Geopolitical units
# FIX(makro): valid_geopolitical_units only reads national_unit / subnational_unit_lv1..3.
- column: Stat_EN
  neotoma: ndb.sitegeopolitical.national_unit
  required: false
  rowwise: false
  type: string
- column: Kraj
  neotoma: ndb.sitegeopolitical.subnational_unit_lv1
  required: false
  rowwise: false
  type: string
- column: Okres
  neotoma: ndb.sitegeopolitical.subnational_unit_lv2
  required: false
  rowwise: false
  type: string
- column: Katastr
  neotoma: ndb.sitegeopolitical.subnational_unit_lv3
  required: false
  rowwise: false
  type: string
### Collection units
- column: Vzorky_Objekt
  neotoma: ndb.collectionunits.handle
  notes: name by author
  required: false
  rowwise: false
  type: string
- column: instArch_date
  neotoma: ndb.collectionunits.colldate
  required: false
  rowwise: false
  type: date
- column: poznObj
  neotoma: ndb.collectionunits.notes
  required: false
  rowwise: false
  type: string
- column: objTyp_EN
  neotoma: ndb.collectionunits.colltypeid
  required: false
  rowwise: false
  type: string
- column: typNaleziste_EN
  neotoma: ndb.collectionunits.depenvtid
  required: false
  rowwise: false
  type: string
### Analysis units
# FIX(makro): `groupby: true` makes the rows that share a depth one analysis unit (and one sample),
# so the 118 rows give 27 analysis units instead of 118.
# NOTE(makro): Vrstva ("layer") holds values 361 ... 650 and is used as the depth in cm. Confirm.
- column: Vrstva
  neotoma: ndb.analysisunits.depth
  required: false
  rowwise: true
  groupby: true
  type: float
- column: Vzorky_Vzorek
  neotoma: ndb.analysisunits.analysisunitname
  required: false
  rowwise: true
  type: string
### Samples
# FIX(makro): no sample name was mapped before.
- column: Vzorky_Vzorek
  neotoma: ndb.samples.samplename
  required: false
  rowwise: true
  type: string
### Contacts
# FIX(makro): the raw file has "Roleček J., BÚ AVČR Brno" / "Hájková P.", which nh.get_contacts cannot
# match (it expects "Family, Initials."). prepare_makro.py rewrites them as "Roleček, J." and
# "Hájková, P." into these columns.
# Assumed roles: archVed (excavation lead) -> collector; Botanik (botanist) -> PI + sample analyst.
- column: collector
  neotoma: ndb.collectors.contactname
  required: false
  rowwise: false
  type: string
- column: datasetpi
  neotoma: ndb.datasetpis.contactname
  required: false
  rowwise: false
  type: string
- column: sampleanalyst
  neotoma: ndb.sampleanalysts.contactname
  required: false
  rowwise: false
  type: string
# One row = one measurement. valid_data reads the names in these columns (taxon, element and units
# added by prepare_makro.py) and looks the variable up in ndb.variables. DataBUS never creates a variable; see
# data/CZ_makro_missing_variables.csv for the ones that do not exist yet.
- column: value
  neotoma: ndb.data.value
  required: true
  rowwise: true
  type: float
- column: taxon
  neotoma: ndb.variables.taxonid
  required: true
  rowwise: true
  type: string
- column: element
  neotoma: ndb.variables.variableelementid
  required: true
  rowwise: true
  type: string
- column: units
  neotoma: ndb.variables.variableunitsid
  required: true
  rowwise: true
  type: string
### What is missing to be mapped:
#   Radiocarbon dates : labCislo, C14-BP, stDevC14, cal-C14, Age_type_ID (-> geochron / chronology)
#   Publication       : autPub / rokPub are empty in this file
# See ../DataBUS/validation_playground.py for the chronology / geochron steps.
