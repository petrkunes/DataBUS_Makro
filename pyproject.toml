[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databus-makro"
version = "1.0.0"
description = "Czech plant-macrofossil upload to Neotoma using Python's DataBUS"
authors = [{name = "Socorro E Dominguez Vidana", email = "dominguezvid@uwisc.edu"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.11.10"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["neotoma", "paleoecology", "interoperability", "postgres", "SQL"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Object Brokering"
]
dependencies = [
    "databus",
    "numpy>=1.26.0,<1.27",
    "openpyxl>=3.1.5",
    "pandas==2.0.2",
    "psycopg2-binary==2.9.10",
    "python-dateutil==2.8.2",
    "python-dotenv==1.0.0",
    "pytz==2023.3",
    "pyyaml>=5.3.1",
    "requests>=2.32.3",
    "six==1.16.0",
    "tzdata==2023.3",
    "tqdm>=4.65.0",
]
[project.urls]
Issues = "https://github.com/petrkunes/DataBUS_Makro/issues"
Repository = "https://github.com/petrkunes/DataBUS_Makro.git"

[tool.setuptools]
include-package-data = true

[tool.uv]
package = false

[tool.uv.sources]
databus = { git = "https://github.com/NeotomaDB/DataBUS", rev = "dev" }

[project.optional-dependencies]
build = ["build", "twine"]
dev = ["ruff", "bumpver", "mypy", "pytest", "pytest-cov"]

[tool.ruff]
# Target Python 3.11
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Enable common rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument (common in validators)
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assertions and have unused imports for fixtures
"**/tests/*" = ["S101", "ARG", "F401"]
# __init__.py files often have unused imports for re-export
"__init__.py" = ["F401"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src"]
